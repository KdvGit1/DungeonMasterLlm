# Monsters — stats from the D&D 5e SRD 5.1 (CC-BY-4.0); a few marked "homebrew" are original variants.
# attacks: hit = attack bonus, dmg = damage dice, type = damage type, range = [normal, long] for ranged
# on_hit: extra effects (save/condition/extra damage)
# behavior: rank (front/back), morale (flee/surrender below this HP fraction once allies fall), tactics tags
# tags: creature type & keywords used for spells (humanoid, undead, beast, fiend, ...)

